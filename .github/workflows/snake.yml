name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate growing snake
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/dahan8473/snake-and-commits/v1/generate.py -o generate.py
          python3 scripts/patch-snake-theme.py generate.py
          mkdir -p dist
          python3 generate.py --user "${{ github.repository_owner }}" \
            --output dist/github-contribution-grid-snake.svg \
            --theme green --no-counter
          python3 generate.py --user "${{ github.repository_owner }}" \
            --output dist/github-contribution-grid-snake-dark.svg \
            --theme matrix --no-counter

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
