name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate growing snake (high-contrast body)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/dahan8473/snake-and-commits/v1/generate.py -o generate.py

          # 1) Light empty cells should be #ebedf0 (GitHub light), not dark.
          # 2) Snake body must stay coral so it doesn't blend into contribution greens.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("generate.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''    "green": dict(
        levels=["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"],
        snake="#39d353", head="#b7ffd0",
        ramp=[(1, "#8affc1"), (4, "#39d353"), (10, "#26a641"), (21, "#006d32")],
        text="#7d8590", frame_bg="#0d1117", frame_border="#30363d",
    ),''',
                  '''    "green": dict(
        levels=["#ebedf0", "#9be9a8", "#40c463", "#30a14e", "#216e39"],
        snake="#ff7b72", head="#ffd8d3",
        ramp=[(1, "#ffd8d3"), (4, "#ff7b72"), (10, "#f85149"), (21, "#da3633")],
        text="#57606a", frame_bg="#ffffff", frame_border="#d0d7de",
    ),''',
              ),
              (
                  '''    "matrix": dict(
        levels=["#0a0f0a", "#0d3d1a", "#12742f", "#1fb84e", "#39ff7a"],
        snake="#39ff7a", head="#d6ffe4",
        ramp=[(1, "#d6ffe4"), (4, "#39ff7a"), (10, "#1fb84e"), (21, "#12742f")],
        text="#3fa060", frame_bg="#000000", frame_border="#123d1f",
    ),''',
                  '''    "matrix": dict(
        levels=["#161b22", "#0e4429", "#006d32", "#26a641", "#39d353"],
        snake="#ff7b72", head="#ffd8d3",
        ramp=[(1, "#ffd8d3"), (4, "#ff7b72"), (10, "#f85149"), (21, "#da3633")],
        text="#7d8590", frame_bg="#0d1117", frame_border="#30363d",
    ),''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"theme patch failed, pattern not found:\n{old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          mkdir -p dist
          python3 generate.py --user "${{ github.repository_owner }}" \
            --output dist/github-contribution-grid-snake.svg \
            --theme green --no-counter
          python3 generate.py --user "${{ github.repository_owner }}" \
            --output dist/github-contribution-grid-snake-dark.svg \
            --theme matrix --no-counter

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
