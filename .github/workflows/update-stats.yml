name: Update Profile Stats

on:
  schedule:
    # 每天 UTC 16:00 ≈ 北京时间 00:00
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history so we can reset onto the latest main before push
          fetch-depth: 0

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=3FB950&text_color=C9D1D9&ring_color=238636
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate personal top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&text_color=C9D1D9&custom_title=Personal%20Languages&langs_count=6
          path: assets/personal-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate excel-formula-calculation pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=${{ github.repository_owner }}&repo=excel-formula-calculation&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=3FB950&text_color=C9D1D9
          path: assets/pin-excel-formula-calculation.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate qualitest pin
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: >-
            username=qualitest-hq&repo=qualitest&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=3FB950&text_color=C9D1D9
          path: assets/pin-qualitest.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        run: |
          curl -fsSL \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&theme=github-dark-blue&hide_border=true&background=0D1117&ring=238636&fire=3FB950&currStreakLabel=58A6FF" \
            -o assets/streak.svg
          # 粗校验：必须是 SVG
          grep -q "<svg" assets/streak.svg

      - name: Generate Qualitest author-weighted languages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: >
          node scripts/generate-org-langs.mjs
          qualitest-hq
          assets/qualitest-langs.svg
          "My Qualitest Share"
          ${{ github.repository_owner }}

      - name: Generate combined languages (personal + org share)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node scripts/generate-my-langs.mjs
          ${{ github.repository_owner }}
          qualitest-hq
          assets/my-langs.svg
          "My Languages"

      - name: Commit updated assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve freshly generated SVGs across reset/retry (avoids rebase conflicts)
          mkdir -p /tmp/profile-stats-assets
          cp -a assets/. /tmp/profile-stats-assets/

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -a /tmp/profile-stats-assets/. assets/
            git add assets/*.svg

            if git diff --staged --quiet; then
              echo "No asset changes vs origin/main"
              exit 0
            fi

            git commit -m "chore: refresh profile stats cards"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}), retrying against latest main..."
          done

          echo "Failed to push after 3 attempts"
          exit 1
